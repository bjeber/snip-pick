# Postgres for local API development. Driven by the scripts in this folder's package.json, and
# from the repo root as `pnpm run db:up` / `db:down` / `db:reset` / `db:seed`.
#
# Needs Docker Desktop to be running; `docker compose` is the CLI it installs.

# Pinned rather than taken from the directory name, which is what compose would otherwise use.
# It names the volume too, so without this, moving this file would have stranded the data behind
# `db_snippick-db` and started again from an empty `snip-pick_snippick-db`.
name: snip-pick

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snippick
      POSTGRES_PASSWORD: snippick
      POSTGRES_DB: snippick
    ports:
      # Bound to loopback: the credentials below are fixed and well known, so this must not be
      # reachable from anything but this machine.
      - '127.0.0.1:55432:5432'
    volumes:
      - snippick-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snippick']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snippick-db:
